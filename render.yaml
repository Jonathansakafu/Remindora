# Render Blueprint: API, workers, web, Postgres and Redis (Key Value).
# Secrets marked `sync: false` are entered once in the Render dashboard.
databases:
  - name: remindora-db
    plan: basic-256mb
    postgresMajorVersion: "17"

services:
  - type: keyvalue
    name: remindora-redis
    plan: starter
    maxmemoryPolicy: noeviction # BullMQ requires noeviction
    ipAllowList: []

  - type: web
    name: remindora-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node --enable-source-maps dist/main.js
    healthCheckPath: /health
    preDeployCommand: cd /app/packages/database && npx prisma migrate deploy
    envVars:
      - fromGroup: remindora-shared
      - key: DATABASE_URL
        fromDatabase: { name: remindora-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: remindora-redis, property: connectionString }
      - key: PORT
        value: "4000"

  - type: worker
    name: remindora-workers
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh -c "cd /app/apps/workers && node --enable-source-maps dist/main.js"
    envVars:
      - fromGroup: remindora-shared
      - key: DATABASE_URL
        fromDatabase: { name: remindora-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: remindora-redis, property: connectionString }

  - type: web
    name: remindora-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

envVarGroups:
  - name: remindora-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false # 32 bytes base64 — keep stable; rotating it invalidates stored OAuth/push tokens
      - key: PAIRING_KEY
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: API_PUBLIC_URL
        sync: false
      - key: WEB_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: BILLING_PROVIDER
        value: stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: FCM_PROJECT_ID
        sync: false
      - key: FCM_CLIENT_EMAIL
        sync: false
      - key: FCM_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
